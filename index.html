<!DOCTYPE html>
<!-- x-vibepoastry — X content engine UI with compose, feed, schedule, and assets tabs -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>x-vibepoastry</title>
  <style>
    /* ── theme tokens ─────────────────────── */
    :root {
      --bg-page:   #f7f9f9;
      --bg-card:   #ffffff;
      --bg-sidebar: #ffffff;
      --border:    #eff3f4;
      --border-2:  #cfd9de;
      --text:      #0f1419;
      --text-2:    #536471;
      --text-3:    #8899a6;
      --hover:     #f7f9f9;
      --ring-bg:   #cfd9de;
      --accent:    #1d9bf0;
      --accent-hover: #1a8cd8;
      --danger:    #f4212e;
      --success:   #00ba7c;
      --warning:   #ffd400;
      --thumb-remove-bg: rgba(0,0,0,0.75);
      --thumb-remove-color: #fff;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-page:   #000000;
        --bg-card:   #000000;
        --bg-sidebar: #000000;
        --border:    #2f3336;
        --border-2:  #2f3336;
        --text:      #e7e9ea;
        --text-2:    #71767b;
        --text-3:    #536471;
        --hover:     #080808;
        --ring-bg:   #2f3336;
        --thumb-remove-bg: rgba(0,0,0,0.75);
        --thumb-remove-color: #e7e9ea;
      }
    }

    :root[data-theme="dark"] {
      --bg-page:   #000000;
      --bg-card:   #000000;
      --bg-sidebar: #000000;
      --border:    #2f3336;
      --border-2:  #2f3336;
      --text:      #e7e9ea;
      --text-2:    #71767b;
      --text-3:    #536471;
      --hover:     #080808;
      --ring-bg:   #2f3336;
      --thumb-remove-bg: rgba(0,0,0,0.75);
      --thumb-remove-color: #e7e9ea;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-page);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── sidebar ──────────────────────────── */
    .sidebar {
      width: 72px;
      min-width: 72px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0;
      gap: 4px;
      height: 100vh;
    }

    .sidebar-logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 20px;
      color: var(--text);
    }

    .sidebar-tab {
      width: 52px;
      height: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      border: none;
      background: none;
      color: var(--text-2);
      cursor: pointer;
      border-radius: 12px;
      transition: background .15s, color .15s;
      font-size: 10px;
      font-weight: 600;
      font-family: inherit;
    }

    .sidebar-tab:hover { background: var(--hover); color: var(--text); }
    .sidebar-tab.active { color: var(--accent); background: rgba(29,155,240,0.1); }
    .sidebar-tab svg { width: 22px; height: 22px; fill: currentColor; }

    .sidebar-bottom {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding-bottom: 8px;
    }

    .sidebar-handle {
      font-size: 11px;
      color: var(--text-2);
      font-weight: 600;
    }

    .vps-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-3);
      transition: background .3s;
    }
    .vps-dot.ok { background: var(--success); }
    .vps-dot.err { background: var(--danger); }

    .theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-2);
      font-size: 16px;
      padding: 4px;
      border-radius: 50%;
    }
    .theme-toggle:hover { background: var(--hover); }

    /* ── main content area ────────────────── */
    .main {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow-y: auto;
      padding: 20px;
    }

    .tab-content {
      display: none;
      width: 100%;
      max-width: 598px;
    }
    .tab-content.active { display: block; }

    /* ── compose tab ──────────────────────── */
    .compose-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .compose-header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      font-size: 15px;
      font-weight: 700;
    }

    /* thread cards */
    .tweet-card {
      display: flex;
      gap: 12px;
      padding: 14px 16px 0;
    }
    .tweet-card.drag-over {
      outline: 2px dashed var(--accent);
      outline-offset: -4px;
      border-radius: 12px;
      background: rgba(29,155,240,0.06);
    }

    .card-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
      width: 40px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      color: white;
      flex-shrink: 0;
      user-select: none;
    }

    .thread-line {
      width: 2px;
      flex: 1;
      min-height: 16px;
      background: var(--ring-bg);
      margin-top: 4px;
      border-radius: 1px;
    }

    .tweet-card:last-child .thread-line { display: none; }

    .card-right {
      flex: 1;
      min-width: 0;
      padding-bottom: 12px;
    }

    .audience-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      padding: 3px 10px 3px 8px;
      border: 1px solid rgba(29,155,240,0.2);
      border-radius: 20px;
      margin-bottom: 10px;
      cursor: default;
    }
    .tweet-card:not(:first-child) .audience-pill { display: none; }

    textarea {
      width: 100%;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 20px;
      font-family: inherit;
      resize: none;
      line-height: 1.5;
      min-height: 60px;
    }
    textarea::placeholder { color: var(--text-3); }

    .image-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
    }

    .img-thumb {
      position: relative;
      width: 120px;
      height: 90px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .img-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .img-thumb .img-remove {
      position: absolute;
      top: 4px;
      right: 4px;
      background: var(--thumb-remove-bg);
      border: none;
      color: var(--thumb-remove-color);
      border-radius: 50%;
      width: 22px;
      height: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      line-height: 1;
    }
    .img-thumb .img-remove:hover { background: rgba(244,33,46,0.85); }

    .card-toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
    }

    .img-attach-btn {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s;
    }
    .img-attach-btn:hover { background: rgba(29,155,240,0.1); }
    .img-attach-btn svg { width: 18px; height: 18px; fill: currentColor; }

    .char-ring {
      margin-left: auto;
      position: relative;
      width: 24px;
      height: 24px;
    }
    .char-ring svg { transform: rotate(-90deg); display: block; }
    .ring-track { fill: none; stroke: var(--ring-bg); stroke-width: 2.5; }
    .ring-fill  { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round;
                  transition: stroke-dashoffset .08s, stroke .08s; }

    .ring-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
      color: var(--text-2);
      pointer-events: none;
    }
    .ring-label.warn { color: var(--warning); }
    .ring-label.over { color: var(--danger); }

    .remove-card-btn {
      background: none;
      border: none;
      color: var(--text-2);
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 18px;
      line-height: 1;
      transition: color .15s;
    }
    .remove-card-btn:hover { color: var(--danger); }

    .add-thread-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px 14px;
    }

    .add-thread-avatar { width: 40px; display: flex; justify-content: center; }

    .mini-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.6;
    }

    .add-thread-btn {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      font-family: inherit;
      padding: 4px 0;
      opacity: 0.7;
      transition: opacity .15s;
    }
    .add-thread-btn:hover { opacity: 1; }

    /* compose bottom toolbar */
    .compose-toolbar {
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .compose-toolbar .spacer { flex: 1; }

    .btn {
      border: none;
      padding: 9px 20px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s, opacity .15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

    .btn-outline {
      background: none;
      border: 1px solid var(--border-2);
      color: var(--text);
    }
    .btn-outline:hover:not(:disabled) { border-color: var(--text); }

    .btn-ghost {
      background: none;
      border: none;
      color: var(--accent);
      padding: 9px 12px;
    }
    .btn-ghost:hover { background: rgba(29,155,240,0.1); }

    .btn-danger {
      background: none;
      border: none;
      color: var(--danger);
      padding: 6px 8px;
      font-size: 13px;
    }
    .btn-danger:hover { background: rgba(244,33,46,0.1); }

    /* ── draft list ───────────────────────── */
    .draft-list {
      margin-top: 16px;
    }

    .draft-list-header {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .draft-item {
      padding: 14px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background .15s;
      position: relative;
    }
    .draft-item:hover { background: var(--hover); }

    .draft-status {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 6px;
    }
    .draft-status.draft { background: rgba(29,155,240,0.15); color: var(--accent); }
    .draft-status.posted { background: rgba(0,186,124,0.15); color: var(--success); }
    .draft-status.scheduled { background: rgba(255,212,0,0.15); color: #b58900; }

    .draft-body {
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .draft-meta { color: var(--text-2); font-size: 12px; margin-top: 6px; }

    .draft-actions {
      display: flex;
      gap: 4px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .draft-actions .btn { font-size: 12px; padding: 5px 12px; font-weight: 600; }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-2);
      font-size: 15px;
    }

    /* ── feed tab ─────────────────────────── */
    .feed-header {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .stats-bar {
      display: flex;
      gap: 20px;
      padding: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-value { font-size: 20px; font-weight: 800; }
    .stat-label { font-size: 12px; color: var(--text-2); font-weight: 500; }

    .tweet-item {
      padding: 14px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .tweet-text {
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 8px;
    }

    .tweet-media {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 6px;
      margin: 4px 0 10px;
    }
    .tweet-media.single { grid-template-columns: 1fr; }
    .tweet-media img {
      width: 100%;
      max-height: 340px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--hover);
      display: block;
    }

    .tweet-metrics {
      display: flex;
      gap: 16px;
      color: var(--text-2);
      font-size: 13px;
    }

    .tweet-metrics span { display: flex; align-items: center; gap: 4px; }
    .tweet-date { font-size: 12px; color: var(--text-3); margin-top: 6px; }

    /* ── schedule tab ─────────────────────── */
    .queue-item {
      padding: 14px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .queue-status {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 6px;
    }
    .queue-status.pending { background: rgba(255,212,0,0.15); color: #b58900; }
    .queue-status.posted { background: rgba(0,186,124,0.15); color: var(--success); }
    .queue-status.failed { background: rgba(244,33,46,0.15); color: var(--danger); }
    .queue-status.cancelled { background: rgba(83,100,113,0.15); color: var(--text-2); }

    .queue-time { font-size: 13px; color: var(--text-2); margin-bottom: 4px; }
    .queue-countdown { font-size: 12px; color: var(--accent); font-weight: 600; }

    /* ── assets tab ───────────────────────── */
    .asset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .asset-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: border-color .15s;
    }
    .asset-card:hover { border-color: var(--accent); }

    .asset-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
    }

    .asset-card .asset-info {
      padding: 8px 10px;
      font-size: 12px;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .asset-card .asset-del {
      position: absolute;
      top: 6px;
      right: 6px;
      background: var(--thumb-remove-bg);
      border: none;
      color: var(--thumb-remove-color);
      border-radius: 50%;
      width: 24px;
      height: 24px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .asset-card:hover .asset-del { display: flex; }
    .asset-card .asset-del:hover { background: rgba(244,33,46,0.85); }

    .text-asset {
      padding: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 8px;
      position: relative;
    }

    .text-asset-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .text-asset-body {
      font-size: 14px;
      color: var(--text-2);
      white-space: pre-wrap;
      line-height: 1.4;
    }

    /* ── schedule modal ───────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 24px;
      width: 400px;
      max-width: 90vw;
    }

    .modal h3 {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .modal input[type="datetime-local"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-2);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: var(--bg-page);
      color: var(--text);
      margin-bottom: 16px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    /* ── toast ────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--accent);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      transition: transform .25s cubic-bezier(0.34,1.56,0.64,1);
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.err  { background: var(--danger); }
    /* ── multi-feed sub-tabs ─────────────────────────── */
    .feed-subtabs {
      display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
      margin-bottom: 14px;
    }
    .subtab {
      padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
      color: var(--text-2); background: transparent; border: 1px solid var(--border);
      cursor: pointer; transition: all .15s;
    }
    .subtab:hover { background: var(--hover); color: var(--text); }
    .subtab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .feed-refresh {
      margin-left: auto; padding: 6px 10px; border-radius: 999px; font-size: 13px;
      color: var(--text-3); background: transparent; border: 1px solid var(--border);
      cursor: pointer;
    }
    .feed-refresh:hover { color: var(--text); background: var(--hover); }
    .feed-cache-note { font-size: 11px; color: var(--text-3); margin: -8px 0 12px; }

    /* mentions / replies-to-do */
    .mention-card { position: relative; }
    .mention-card.done { opacity: .45; }
    .mention-author { font-weight: 700; font-size: 14px; color: var(--text); }
    .mention-actions { display: flex; gap: 10px; margin-top: 8px; align-items: center; }
    .mention-actions a { color: var(--accent); font-size: 13px; text-decoration: none; }
    .done-toggle {
      font-size: 12px; color: var(--text-3); background: transparent;
      border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; cursor: pointer;
    }
    .done-toggle:hover { color: var(--success); border-color: var(--success); }

    /* are.na blocks */
    .arena-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .arena-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; display: flex; flex-direction: column;
    }
    .arena-card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: var(--hover); }
    .arena-card-body { padding: 10px 12px; font-size: 13px; color: var(--text); }
    .arena-card-meta { padding: 0 12px 10px; font-size: 11px; color: var(--text-3); }
    .arena-card a { color: inherit; text-decoration: none; }

    /* topical keyword chips + editor */
    .kw-chip {
      display: inline-block; font-size: 11px; color: var(--accent);
      border: 1px solid var(--accent); border-radius: 999px; padding: 1px 8px; margin-top: 6px;
    }
    .kw-editor { margin-bottom: 14px; }
    .kw-editor textarea {
      width: 100%; min-height: 100px; background: var(--bg-card); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
      font-size: 14px; font-family: inherit; resize: vertical;
    }

    /* AI suggestions */
    .suggestion-card { border-left: 3px solid var(--accent); }
    .suggestion-actions { display: flex; gap: 8px; margin-top: 10px; }

    /* analytics */
    .analytics-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px; margin-bottom: 16px;
    }
    .metric-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px;
    }
    .metric-card .m-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .4px; }
    .metric-card .m-value { font-size: 20px; font-weight: 800; color: var(--text); margin-top: 2px; }
    .metric-card .m-sub { font-size: 11px; color: var(--text-2); margin-top: 2px; }
  </style>
</head>

<script>
  // Same-origin API (works on any port/host: dev :3132, prod :3131, Daylight/mobile via LAN IP)
  const API = location.origin.startsWith('http') ? location.origin : 'http://localhost:3131';
  const MAX = 25000;  // Premium long-post limit — 280 is obsolete for @_welf
  const CIRC = 2 * Math.PI * 9;
  let cardSeq = 0;
  const cardImages = new Map();
  let currentEditDraftId = null;

  // ── theme ──────────────────────────────────────────────

  function applyTheme(t) {
    if (t) document.documentElement.setAttribute('data-theme', t);
    else   document.documentElement.removeAttribute('data-theme');
    updateThemeIcon(t);
  }

  function updateThemeIcon(t) {
    const eff = t || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
    document.getElementById('themeBtn').textContent = eff === 'dark' ? '\u2600\uFE0F' : '\uD83C\uDF19';
  }

  function cycleTheme() {
    const cur = localStorage.getItem('xvp-theme');
    const sys = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
    const next = cur ? null : (sys === 'dark' ? 'light' : 'dark');
    if (next) localStorage.setItem('xvp-theme', next);
    else localStorage.removeItem('xvp-theme');
    applyTheme(next);
  }

  applyTheme(localStorage.getItem('xvp-theme'));
  matchMedia('(prefers-color-scheme:dark)').addEventListener('change', () => {
    if (!localStorage.getItem('xvp-theme')) updateThemeIcon(null);
  });

  // ── tabs ───────────────────────────────────────────────

  function switchTab(name) {
    document.querySelectorAll('.sidebar-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('.tab-content').forEach(el => el.classList.toggle('active', el.id === `tab-${name}`));
    if (name === 'feed') loadFeed();
    if (name === 'schedule') loadQueue();
    if (name === 'assets') loadAssets();
  }

  // ── VPS status check ──────────────────────────────────

  async function checkVPS() {
    const dot = document.getElementById('vpsDot');
    try {
      const r = await fetch(`${API}/status`);
      const d = await r.json();
      dot.className = d.ok ? 'vps-dot ok' : 'vps-dot err';
      dot.title = d.ok ? `Connected: @${d.username}` : (d.error || 'Error');
    } catch {
      dot.className = 'vps-dot err';
      dot.title = 'VPS unreachable';
    }
  }

  // ── card management ────────────────────────────────────

  function addCard(text = '') {
    const id = ++cardSeq;
    cardImages.set(id, []);

    const card = document.createElement('div');
    card.className = 'tweet-card';
    card.dataset.id = id;
    card.innerHTML = `
      <div class="card-left">
        <div class="avatar">W</div>
        <div class="thread-line"></div>
      </div>
      <div class="card-right">
        <div class="audience-pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
          Everyone
        </div>
        <textarea placeholder="What is happening?!" oninput="onInput(${id})" rows="3">${esc(text)}</textarea>
        <div class="image-strip" id="strip-${id}"></div>
        <div class="card-toolbar">
          <button class="img-attach-btn" onclick="triggerFileInput(${id})" title="Attach images">
            <svg viewBox="0 0 24 24"><path d="M3 5.5C3 4.119 4.119 3 5.5 3h13C19.881 3 21 4.119 21 5.5v13c0 1.381-1.119 2.5-2.5 2.5h-13C4.119 21 3 19.881 3 18.5v-13zM5.5 5c-.276 0-.5.224-.5.5v9.086l3-3 3 3 5-5 3 3V5.5c0-.276-.224-.5-.5-.5h-13zM19 15.414l-3-3-5 5-3-3-3 3V18.5c0 .276.224.5.5.5h13c.276 0 .5-.224.5-.5v-3.086zM9.75 7C8.784 7 8 7.784 8 8.75s.784 1.75 1.75 1.75 1.75-.784 1.75-1.75S10.716 7 9.75 7z"/></svg>
          </button>
          <input type="file" id="file-${id}" accept="image/*" multiple hidden onchange="onFilesChosen(${id}, this)">
          <div class="char-ring" id="ring-${id}">
            <svg width="24" height="24" viewBox="0 0 24 24">
              <circle class="ring-track" cx="12" cy="12" r="9"/>
              <circle class="ring-fill" cx="12" cy="12" r="9" id="ringFill-${id}" stroke-dasharray="${CIRC.toFixed(2)}" stroke-dashoffset="${CIRC.toFixed(2)}"/>
            </svg>
            <div class="ring-label" id="ringLabel-${id}"></div>
          </div>
          <button class="remove-card-btn" onclick="removeCard(${id})" title="Remove tweet">\u00d7</button>
        </div>
      </div>
    `;

    document.getElementById('threadContainer').appendChild(card);
    updateRemoveButtons();

    const ta = card.querySelector('textarea');
    ta.addEventListener('input', () => autoResize(ta));
    autoResize(ta);

    // Drag & drop image files onto the card
    ['dragenter', 'dragover'].forEach(ev => card.addEventListener(ev, e => {
      if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')) {
        e.preventDefault();
        card.classList.add('drag-over');
      }
    }));
    ['dragleave', 'dragend', 'drop'].forEach(ev => card.addEventListener(ev, e => {
      if (ev !== 'dragleave' || e.target === card) card.classList.remove('drag-over');
    }));
    card.addEventListener('drop', e => {
      const files = e.dataTransfer?.files;
      if (files && files.length) { e.preventDefault(); addFilesToCard(id, files); }
    });

    // Paste image from clipboard into the textarea
    ta.addEventListener('paste', e => {
      const imgs = Array.from(e.clipboardData?.items || [])
        .filter(it => it.kind === 'file' && it.type.startsWith('image/'))
        .map(it => it.getAsFile())
        .filter(Boolean);
      if (imgs.length) { e.preventDefault(); addFilesToCard(id, imgs); }
    });

    setTimeout(() => ta.focus(), 0);
    onInput(id);
    return id;
  }

  function removeCard(id) {
    const cards = document.querySelectorAll('.tweet-card');
    if (cards.length <= 1) return;
    document.querySelector(`.tweet-card[data-id="${id}"]`)?.remove();
    cardImages.delete(id);
    updateRemoveButtons();
    updateButtons();
  }

  function updateRemoveButtons() {
    const cards = document.querySelectorAll('.tweet-card');
    cards.forEach(c => {
      c.querySelector('.remove-card-btn').style.display = cards.length > 1 ? '' : 'none';
    });
  }

  function autoResize(ta) {
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  }

  // ── char counter ───────────────────────────────────────

  function onInput(id) {
    const ta = document.querySelector(`.tweet-card[data-id="${id}"] textarea`);
    if (!ta) return;
    const len = ta.value.length;
    const left = MAX - len;
    const pct = Math.min(len / MAX, 1.1);

    const fill = document.getElementById(`ringFill-${id}`);
    const label = document.getElementById(`ringLabel-${id}`);

    fill.style.strokeDashoffset = CIRC - pct * CIRC;

    if (len === 0) {
      fill.style.stroke = '#2f3336'; label.textContent = ''; label.className = 'ring-label';
    } else if (left > 20) {
      fill.style.stroke = 'var(--accent)'; label.textContent = ''; label.className = 'ring-label';
    } else if (left >= 0) {
      fill.style.stroke = 'var(--warning)'; label.textContent = left; label.className = 'ring-label warn';
    } else {
      fill.style.stroke = 'var(--danger)'; label.textContent = left; label.className = 'ring-label over';
    }

    updateButtons();
    autosaveComposer();
  }

  function updateButtons() {
    const cards = document.querySelectorAll('.tweet-card');
    let canPost = false, anyOver = false;

    cards.forEach(c => {
      const id = +c.dataset.id;
      const ta = c.querySelector('textarea');
      const len = ta.value.length;
      const imgs = cardImages.get(id) || [];
      if (len > 0 || imgs.length > 0) canPost = true;
      if (len > MAX) anyOver = true;
    });

    const ok = canPost && !anyOver;
    document.getElementById('postBtn').disabled = !ok;
    document.getElementById('scheduleBtn').disabled = !ok;
    document.getElementById('jamBtn').disabled = !ok;
  }

  // ── image handling ─────────────────────────────────────

  function triggerFileInput(id) {
    if ((cardImages.get(id) || []).length >= 4) { toast('Max 4 images per tweet', true); return; }
    document.getElementById(`file-${id}`).click();
  }

  // Shared entry point for the file picker, drag-drop, and paste.
  function addFilesToCard(id, fileList) {
    const slots = 4 - (cardImages.get(id) || []).length;
    if (slots <= 0) { toast('Max 4 images per tweet', true); return; }
    const files = Array.from(fileList).filter(f => f.type.startsWith('image/')).slice(0, slots);
    if (!files.length) return;

    Promise.all(files.map(file => new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = e => resolve({
        data: e.target.result.split(',')[1],
        mimeType: file.type,
        name: file.name || 'pasted.png',
        preview: e.target.result,
      });
      reader.readAsDataURL(file);
    }))).then(newImgs => {
      cardImages.set(id, [...(cardImages.get(id) || []), ...newImgs]);
      renderImageStrip(id);
      updateButtons();
      autosaveComposer();
    });
  }

  function onFilesChosen(id, input) {
    addFilesToCard(id, input.files);
    input.value = '';
  }

  function removeImage(cardId, imgIdx) {
    const imgs = cardImages.get(cardId) || [];
    imgs.splice(imgIdx, 1);
    cardImages.set(cardId, imgs);
    renderImageStrip(cardId);
    updateButtons();
    autosaveComposer();
  }

  function renderImageStrip(cardId) {
    const strip = document.getElementById(`strip-${cardId}`);
    if (!strip) return;
    const imgs = cardImages.get(cardId) || [];
    strip.innerHTML = imgs.map((img, i) => `
      <div class="img-thumb">
        <img src="${img.preview}" alt="${esc(img.name)}">
        <button class="img-remove" onclick="removeImage(${cardId},${i})" title="Remove">\u00d7</button>
      </div>
    `).join('');
  }

  // ── collect thread data ────────────────────────────────

  function collectThread() {
    return Array.from(document.querySelectorAll('.tweet-card')).map(c => {
      const id = +c.dataset.id;
      const text = c.querySelector('textarea').value.trim();
      const imgs = (cardImages.get(id) || []).map(({data, mimeType, name, preview}) => ({data, mimeType, name, preview}));
      return { text, media: imgs };
    }).filter(t => t.text || t.media.length);
  }

  function clearComposer() {
    document.getElementById('threadContainer').innerHTML = '';
    cardImages.clear();
    cardSeq = 0;
    currentEditDraftId = null;
    try { localStorage.removeItem(AUTOSAVE_KEY); } catch {}
    addCard();
  }

  // ── composer autosave ───────────────────────────────────
  // Persist-first: typed text AND attached images are written to localStorage
  // on every change and restored on load, so a reload / crash / accidental
  // close can never lose composer input. Cleared only on a successful post.
  const AUTOSAVE_KEY = 'xvp_composer_autosave_v1';
  let _autosaveTimer = null;

  function snapshotComposer() {
    const cards = Array.from(document.querySelectorAll('.tweet-card')).map(c => {
      const id = +c.dataset.id;
      return {
        text: c.querySelector('textarea').value,
        images: (cardImages.get(id) || []).map(({data, mimeType, name, preview}) => ({data, mimeType, name, preview})),
      };
    });
    return { cards, draftId: currentEditDraftId };
  }

  function autosaveComposer() {
    clearTimeout(_autosaveTimer);
    _autosaveTimer = setTimeout(() => {
      const snap = snapshotComposer();
      const hasContent = snap.cards.some(c => c.text.trim() || c.images.length);
      try {
        if (hasContent) localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(snap));
        else localStorage.removeItem(AUTOSAVE_KEY);
      } catch (e) {
        // Quota (usually oversized images). NEVER silently drop — salvage the
        // text and warn loudly so nothing typed is lost on reload.
        try {
          localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(
            { draftId: snap.draftId, cards: snap.cards.map(c => ({ text: c.text, images: [] })) }));
        } catch {}
        toast('⚠︎ images too large to auto-cache — don’t reload before posting', true);
      }
    }, 400);
  }

  function restoreComposer() {
    let snap = null;
    try { snap = JSON.parse(localStorage.getItem(AUTOSAVE_KEY) || 'null'); } catch { snap = null; }
    if (!snap || !Array.isArray(snap.cards)) return false;
    const hasContent = snap.cards.some(c => (c.text || '').trim() || (c.images || []).length);
    if (!hasContent) return false;

    document.getElementById('threadContainer').innerHTML = '';
    cardImages.clear();
    cardSeq = 0;
    currentEditDraftId = snap.draftId || null;
    snap.cards.forEach(cd => {
      const id = addCard(cd.text || '');
      if (cd.images && cd.images.length) {
        cardImages.set(id, cd.images);
        renderImageStrip(id);
      }
    });
    updateButtons();
    const imgCount = snap.cards.reduce((n, c) => n + (c.images ? c.images.length : 0), 0);
    toast(`Restored unsaved draft${imgCount ? ` + ${imgCount} image${imgCount > 1 ? 's' : ''}` : ''}`);
    return true;
  }

  // ── post handler ───────────────────────────────────────

  // ── post handler ───────────────────────────────────────

  async function handlePost() {
    const thread = collectThread();
    if (!thread.length) return;

    const btn = document.getElementById('postBtn');
    btn.disabled = true;
    btn.textContent = 'Posting\u2026';

    try {
      const payload = {
        tweets: thread.map(t => ({
          text: t.text,
          media: t.media.filter(m => m.data),
        })),
      };
      if (currentEditDraftId) payload.draft_id = currentEditDraftId;

      const res = await fetch(`${API}/post`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

      clearComposer();
      loadDrafts();
      toast(`Posted! \u2192 ${data.url}`);
    } catch (e) {
      toast('Error: ' + e.message, true);
    } finally {
      btn.textContent = 'Post';
      updateButtons();
    }
  }

  // ── draft management ───────────────────────────────────

  async function saveDraftFromComposer() {
    const thread = collectThread();
    if (!thread.length) { toast('Nothing to save', true); return; }

    try {
      if (currentEditDraftId) {
        await fetch(`${API}/drafts/${currentEditDraftId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ thread: thread.map(t => ({ text: t.text })) }),
        });
        toast('Draft updated');
      } else {
        const res = await fetch(`${API}/drafts`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ thread: thread.map(t => ({ text: t.text })) }),
        });
        const data = await res.json();
        currentEditDraftId = data.id;
        toast('Draft saved');
      }
      loadDrafts();
    } catch (e) {
      toast('Error: ' + e.message, true);
    }
  }

  async function loadDrafts() {
    try {
      const res = await fetch(`${API}/drafts`);
      const data = await res.json();
      renderDraftList(data.drafts || []);
    } catch {
      document.getElementById('draftListItems').innerHTML = '<div class="empty-state">Could not load drafts</div>';
    }
  }

  function renderDraftList(drafts) {
    const el = document.getElementById('draftListItems');
    if (!drafts.length) {
      el.innerHTML = '<div class="empty-state">No drafts yet</div>';
      return;
    }

    el.innerHTML = drafts.map(d => {
      const thread = d.thread || [];
      const preview = thread[0]?.text || '(empty)';
      const isThread = thread.length > 1;
      const statusClass = d.status || 'draft';

      return `
        <div class="draft-item">
          <span class="draft-status ${statusClass}">${statusClass}${isThread ? ` \u00b7 ${thread.length} tweets` : ''}</span>
          <div class="draft-body">${esc(preview.slice(0, 200))}${preview.length > 200 ? '\u2026' : ''}</div>
          <div class="draft-meta">${d.created_at || ''}</div>
          <div class="draft-actions">
            <button class="btn btn-outline" onclick="editDraft('${d.id}')">Edit</button>
            <button class="btn btn-ghost" onclick="jamDraft('${d.id}')">Jam</button>
            <button class="btn btn-outline" onclick="scheduleDraft('${d.id}')">Schedule</button>
            <button class="btn btn-primary" onclick="postDraft('${d.id}')" style="font-size:12px;padding:5px 12px;">Post</button>
            <button class="btn btn-danger" onclick="deleteDraft('${d.id}')">Delete</button>
          </div>
        </div>
      `;
    }).join('');
  }

  async function editDraft(id) {
    try {
      const res = await fetch(`${API}/drafts/${id}`);
      const draft = await res.json();
      const thread = draft.thread || [];

      document.getElementById('threadContainer').innerHTML = '';
      cardImages.clear();
      cardSeq = 0;
      currentEditDraftId = id;

      thread.forEach(t => addCard(t.text || ''));
      updateButtons();
    } catch (e) {
      toast('Error loading draft: ' + e.message, true);
    }
  }

  async function deleteDraft(id) {
    try {
      await fetch(`${API}/drafts/${id}`, { method: 'DELETE' });
      if (currentEditDraftId === id) clearComposer();
      loadDrafts();
      toast('Draft deleted');
    } catch (e) {
      toast('Error: ' + e.message, true);
    }
  }

  async function postDraft(id) {
    try {
      const res = await fetch(`${API}/post`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ draft_id: id }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      loadDrafts();
      if (currentEditDraftId === id) clearComposer();
      toast(`Posted! \u2192 ${data.url}`);
    } catch (e) {
      toast('Error: ' + e.message, true);
    }
  }

  async function jamDraft(id) {
    try {
      const res = await fetch(`${API}/drafts/${id}/jam`, { method: 'POST' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      // Server already pbcopy'd on the Mac; also copy in-browser as a fallback
      // (covers LAN access where the browser isn't on the server machine).
      try { if (data.prompt && navigator.clipboard) await navigator.clipboard.writeText(data.prompt); } catch {}
      toast('Jam copied \u2014 paste /cc-x-jam in Terminal');
    } catch (e) {
      toast('Error: ' + e.message, true);
    }
  }

  async function jamCurrentDraft() {
    const thread = collectThread();
    if (!thread.length) return;

    // Save as draft first if needed
    if (!currentEditDraftId) {
      const res = await fetch(`${API}/drafts`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ thread: thread.map(t => ({ text: t.text })) }),
      });
      const data = await res.json();
      currentEditDraftId = data.id;
    }

    jamDraft(currentEditDraftId);
  }

  // ── schedule ───────────────────────────────────────────

  let scheduleDraftId = null;

  function openScheduleModal(draftId) {
    scheduleDraftId = draftId || null;
    // Default to 1 hour from now
    const d = new Date(Date.now() + 3600000);
    document.getElementById('scheduleTime').value = d.toISOString().slice(0, 16);
    document.getElementById('scheduleModal').classList.add('open');
  }

  function closeScheduleModal() {
    document.getElementById('scheduleModal').classList.remove('open');
    scheduleDraftId = null;
  }

  function scheduleDraft(id) {
    scheduleDraftId = id;
    openScheduleModal(id);
  }

  async function confirmSchedule() {
    const timeInput = document.getElementById('scheduleTime').value;
    if (!timeInput) { toast('Pick a time', true); return; }

    const scheduledAt = new Date(timeInput).toISOString();
    let tweets;

    if (scheduleDraftId) {
      const res = await fetch(`${API}/drafts/${scheduleDraftId}`);
      const draft = await res.json();
      tweets = (draft.thread || []).map(t => ({ text: t.text }));
    } else {
      tweets = collectThread().map(t => ({ text: t.text }));
    }

    try {
      const res = await fetch(`${API}/schedule`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tweets,
          scheduled_at: scheduledAt,
          draft_id: scheduleDraftId || currentEditDraftId,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || data.detail);

      closeScheduleModal();
      loadDrafts();
      toast('Scheduled!');
    } catch (e) {
      toast('Error: ' + e.message, true);
    }
  }

  // ── feed tab ───────────────────────────────────────────

  let currentFeed = 'top';
  let statsLoaded = false;

  async function loadFeed() {
    if (!statsLoaded) {
      try {
        const res = await fetch(`${API}/stats`);
        const data = await res.json();
        document.getElementById('statFollowers').textContent = fmtNum(data.followers);
        document.getElementById('statTweets').textContent = fmtNum(data.tweet_count);
        document.getElementById('statLikes').textContent = fmtNum(data.recent_metrics?.total_likes || 0);
        document.getElementById('statImpressions').textContent = fmtNum(data.recent_metrics?.total_impressions || 0);
        statsLoaded = true;
      } catch {}
    }
    renderCurrentFeed();
  }

  function switchFeed(name) {
    currentFeed = name;
    document.querySelectorAll('.subtab').forEach(b => b.classList.toggle('active', b.dataset.feed === name));
    toggleKwEditor(false);
    renderCurrentFeed();
  }

  function refreshCurrentFeed() { renderCurrentFeed(true); }

  function cacheNote(data) {
    const el = document.getElementById('feedCacheNote');
    if (data && data.from_cache) {
      el.textContent = `cached ${data.cached_at ? fmtDate(data.cached_at + 'Z') : ''}${data.stale ? ' \u00B7 live fetch failed, showing stale' : ''} \u2014 \u21BB for live`;
    } else if (data) {
      el.textContent = 'live';
    } else el.textContent = '';
  }

  function tweetMedia(media) {
    if (!media || !media.length) return '';
    const cls = media.length === 1 ? 'tweet-media single' : 'tweet-media';
    return `<div class="${cls}">` +
      media.map(m => `<img src="${esc(m.url)}" alt="${esc(m.alt || '')}" loading="lazy">`).join('') +
      `</div>`;
  }

  function tweetCard(t, extra = '') {
    return `
      <div class="tweet-item">
        ${t.author_username ? `<div class="mention-author">@${esc(t.author_username)}</div>` : ''}
        <div class="tweet-text">${esc(t.text)}</div>
        ${tweetMedia(t.media)}
        <div class="tweet-metrics">
          <span>\u2764\uFE0F ${fmtNum(t.metrics.likes)}</span>
          <span>\uD83D\uDD01 ${fmtNum(t.metrics.retweets)}</span>
          <span>\uD83D\uDCAC ${fmtNum(t.metrics.replies)}</span>
          ${t.metrics.impressions != null ? `<span>\uD83D\uDC41 ${fmtNum(t.metrics.impressions)}</span>` : ''}
        </div>
        ${extra}
        <div class="tweet-date">${fmtDate(t.created_at)}</div>
      </div>`;
  }

  async function renderCurrentFeed(refresh = false) {
    const el = document.getElementById('feedList');
    const q = refresh ? '&refresh=1' : '';
    el.innerHTML = '<div class="empty-state">Loading\u2026</div>';
    try {
      if (currentFeed === 'top' || currentFeed === 'recent') {
        const res = await fetch(`${API}/feeds/mine?sort=${currentFeed === 'top' ? 'top' : 'recent'}${q}`);
        const data = await res.json();
        cacheNote(data);
        el.innerHTML = (data.tweets || []).map(t => tweetCard(t)).join('') || '<div class="empty-state">No tweets</div>';

      } else if (currentFeed === 'replies') {
        const res = await fetch(`${API}/feeds/replies?x=1${q}`);
        const data = await res.json();
        cacheNote(data);
        const open = (data.mentions || []).filter(m => !m.done);
        const done = (data.mentions || []).filter(m => m.done);
        const card = m => `
          <div class="tweet-item mention-card${m.done ? ' done' : ''}">
            <div class="mention-author">@${esc(m.author_username)}</div>
            <div class="tweet-text">${esc(m.text)}</div>
            <div class="mention-actions">
              <a href="https://x.com/i/web/status/${m.id}" target="_blank">Reply on X \u2197</a>
              <button class="done-toggle" onclick="toggleReplyDone('${m.id}', ${!m.done})">${m.done ? 'undo' : 'mark replied'}</button>
            </div>
          </div>`;
        el.innerHTML =
          (open.length ? open.map(card).join('') : '<div class="empty-state">Inbox zero \u2014 no replies owed \uD83C\uDF89</div>') +
          (done.length ? `<div class="feed-cache-note" style="margin:14px 0 8px;">handled (${done.length})</div>` + done.map(card).join('') : '');

      } else if (currentFeed === 'arena') {
        const res = await fetch(`${API}/feeds/arena?x=1${q}`);
        const data = await res.json();
        cacheNote(data);
        el.innerHTML = `<div class="arena-grid">` + (data.blocks || []).map(b => `
          <div class="arena-card">
            ${b.image ? `<img src="${b.image}" loading="lazy" alt="">` : ''}
            <div class="arena-card-body">${b.source_url ? `<a href="${b.source_url}" target="_blank">` : ''}${esc(b.title || (b.content || '').slice(0, 120) || '(untitled)')}${b.source_url ? ' \u2197</a>' : ''}</div>
            <div class="arena-card-meta">${esc(b.channel)} \u00B7 ${esc(b.class)}</div>
          </div>`).join('') + `</div>`;

      } else if (currentFeed === 'topical') {
        const res = await fetch(`${API}/feeds/topical?x=1${q}`);
        const data = await res.json();
        cacheNote(data);
        const kwBtn = `<button class="btn btn-outline" style="font-size:13px; padding:6px 14px; margin-bottom:12px;" onclick="openKwEditor()">Edit keywords (${(data.keywords || []).length})</button>`;
        const errNote = data.errors ? `<div class="feed-cache-note">\u26A0\uFE0E ${data.errors.length} keyword(s) failed \u2014 ${esc(data.errors[0].error)}${data.errors[0].error === 'Not Found' ? ' (VPS /search not deployed yet)' : ''}</div>` : '';
        el.innerHTML = kwBtn + errNote +
          ((data.tweets || []).map(t => tweetCard(t, `<span class="kw-chip">${esc(t.matched_keyword)}</span>`)).join('') ||
           '<div class="empty-state">No topical tweets yet</div>');

      } else if (currentFeed === 'suggestions') {
        const res = await fetch(`${API}/drafts?kind=suggestion`);
        const data = await res.json();
        cacheNote(null);
        el.innerHTML = (data.drafts || []).map(d => `
          <div class="tweet-item suggestion-card">
            ${d.thread.map(t => `<div class="tweet-text">${esc(t.text)}</div>`).join('<hr style="border:none;border-top:1px solid var(--border);margin:8px 0;">')}
            <div class="suggestion-actions">
              <button class="btn btn-primary" style="font-size:12px; padding:5px 12px;" onclick="promoteSuggestion('${d.id}')">\u2192 Compose</button>
              <button class="btn btn-outline" style="font-size:12px; padding:5px 12px;" onclick="deleteSuggestion('${d.id}')">Dismiss</button>
            </div>
          </div>`).join('') || '<div class="empty-state">No AI suggestions yet \u2014 the idea machine fills this tab</div>';

      } else if (currentFeed === 'analytics') {
        const res = await fetch(`${API}/analytics`);
        const data = await res.json();
        cacheNote(null);
        if (!data.ok) { el.innerHTML = `<div class="empty-state">${esc(data.error)}</div>`; return; }
        const w = data.windows;
        const winCard = (label, x) => x ? `
          <div class="metric-card"><div class="m-label">${label}</div>
            <div class="m-value">${x.avg_engagement}</div>
            <div class="m-sub">${x.avg_likes}\u2665 \u00B7 ${fmtNum(x.avg_impressions)} views avg</div></div>` : '';
        el.innerHTML = `
          <div class="analytics-grid">
            <div class="metric-card"><div class="m-label">Last 7 days</div><div class="m-value">${data.counts.last_7d}</div><div class="m-sub">tweets</div></div>
            <div class="metric-card"><div class="m-label">Last 30 days</div><div class="m-value">${data.counts.last_30d}</div><div class="m-sub">tweets</div></div>
            <div class="metric-card"><div class="m-label">Last 90 days</div><div class="m-value">${data.counts.last_90d}</div><div class="m-sub">tweets (sample: ${data.sample})</div></div>
            <div class="metric-card"><div class="m-label">Replies vs posts</div><div class="m-value">${data.replies_vs_posts.replies}:${data.replies_vs_posts.posts}</div><div class="m-sub">of last ${data.sample}</div></div>
          </div>
          <div class="feed-header" style="font-size:16px;">Avg engagement per tweet</div>
          <div class="analytics-grid">
            ${winCard('Last 10', w.last_10)}${winCard('Last 20', w.last_20)}${winCard('Last 50', w.last_50)}${winCard('Last 100', w.last_100)}
          </div>
          <div class="feed-cache-note">engagement = likes + 2\u00B7retweets + replies + 2\u00B7bookmarks \u00B7 computed from cache, costs nothing</div>`;
      }
    } catch (e) {
      el.innerHTML = `<div class="empty-state">Could not load: ${esc(e.message)}</div>`;
    }
  }

  async function toggleReplyDone(id, done) {
    await fetch(`${API}/feeds/replies/${id}/done`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ done }),
    });
    renderCurrentFeed();
  }

  // keyword editor
  async function openKwEditor() {
    const res = await fetch(`${API}/settings/feed_keywords`);
    const data = await res.json();
    document.getElementById('kwTextarea').value = (data.value || []).join('\n');
    toggleKwEditor(true);
  }
  function toggleKwEditor(show) {
    document.getElementById('kwEditor').style.display = show ? 'block' : 'none';
  }
  async function saveKeywords() {
    const value = document.getElementById('kwTextarea').value.split('\n').map(s => s.trim()).filter(Boolean);
    await fetch(`${API}/settings/feed_keywords`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ value }),
    });
    toggleKwEditor(false);
    toast('Keywords saved \u2014 refreshing topical feed');
    renderCurrentFeed(true);
  }

  // AI suggestions
  async function promoteSuggestion(id) {
    await fetch(`${API}/drafts/${id}/promote`, { method: 'POST' });
    await editDraft(id);
    toast('Moved to composer');
  }
  async function deleteSuggestion(id) {
    await fetch(`${API}/drafts/${id}`, { method: 'DELETE' });
    renderCurrentFeed();
  }

  // ── schedule tab ───────────────────────────────────────

  async function loadQueue() {
    try {
      const res = await fetch(`${API}/queue`);
      const data = await res.json();
      const el = document.getElementById('queueList');

      if (!data.items?.length) {
        el.innerHTML = '<div class="empty-state">No scheduled posts</div>';
        return;
      }

      el.innerHTML = data.items.map(item => {
        const tweets = JSON.parse(item.tweets_json || '[]');
        const preview = tweets[0]?.text || '(empty)';
        const countdown = item.status === 'pending' ? getCountdown(item.scheduled_at) : '';

        return `
          <div class="queue-item">
            <span class="queue-status ${item.status}">${item.status}</span>
            ${countdown ? `<span class="queue-countdown">${countdown}</span>` : ''}
            <div class="queue-time">Scheduled: ${fmtDate(item.scheduled_at)}</div>
            <div class="draft-body">${esc(preview.slice(0, 200))}</div>
            ${item.tweet_url ? `<div class="draft-meta"><a href="${item.tweet_url}" target="_blank">${item.tweet_url}</a></div>` : ''}
            ${item.error ? `<div class="draft-meta" style="color:var(--danger)">Error: ${esc(item.error)}</div>` : ''}
            ${item.status === 'pending' ? `<div class="draft-actions"><button class="btn btn-danger" onclick="cancelScheduled('${item.id}')">Cancel</button></div>` : ''}
          </div>
        `;
      }).join('');
    } catch (e) {
      document.getElementById('queueList').innerHTML = `<div class="empty-state">Could not load queue: ${e.message}</div>`;
    }
  }

  async function cancelScheduled(id) {
    try {
      await fetch(`${API}/queue/${id}`, { method: 'DELETE' });
      loadQueue();
      toast('Cancelled');
    } catch (e) {
      toast('Error: ' + e.message, true);
    }
  }

  // ── assets tab ─────────────────────────────────────────

  async function loadAssets() {
    try {
      const res = await fetch(`${API}/assets`);
      const data = await res.json();
      const assets = data.assets || [];

      const images = assets.filter(a => a.type === 'image');
      const texts = assets.filter(a => a.type !== 'image');

      const imgEl = document.getElementById('imageAssets');
      if (images.length) {
        imgEl.innerHTML = images.map(a => {
          const src = a.file_path ? `${API}/media/assets/${a.file_path.split('/').pop()}` : '';
          return `
            <div class="asset-card">
              <img src="${src}" alt="${esc(a.title || '')}">
              <div class="asset-info">${esc(a.title || 'Untitled')}</div>
              <button class="asset-del" onclick="deleteAsset('${a.id}')" title="Delete">\u00d7</button>
            </div>
          `;
        }).join('');
      } else {
        imgEl.innerHTML = '';
      }

      const txtEl = document.getElementById('textAssets');
      if (texts.length) {
        txtEl.innerHTML = texts.map(a => `
          <div class="text-asset">
            ${a.title ? `<div class="text-asset-title">${esc(a.title)}</div>` : ''}
            <div class="text-asset-body">${esc(a.content || '')}</div>
            <button class="asset-del" style="display:flex;top:8px;right:8px;" onclick="deleteAsset('${a.id}')" title="Delete">\u00d7</button>
          </div>
        `).join('');
      } else {
        txtEl.innerHTML = '';
      }

      if (!images.length && !texts.length) {
        imgEl.innerHTML = '<div class="empty-state">No assets yet</div>';
      }
    } catch (e) {
      document.getElementById('imageAssets').innerHTML = `<div class="empty-state">Could not load assets: ${e.message}</div>`;
    }
  }

  function triggerAssetUpload() {
    document.getElementById('assetFileInput').click();
  }

  async function handleAssetUpload(input) {
    for (const file of input.files) {
      const formData = new FormData();
      formData.append('file', file);
      try {
        await fetch(`${API}/assets`, { method: 'POST', body: formData });
      } catch (e) {
        toast('Upload error: ' + e.message, true);
      }
    }
    input.value = '';
    loadAssets();
    toast('Uploaded');
  }

  function promptNewNote() {
    const title = prompt('Note title (optional):');
    if (title === null) return;
    const content = prompt('Note content:');
    if (!content) return;

    fetch(`${API}/assets`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'text', title, content }),
    }).then(() => {
      loadAssets();
      toast('Note saved');
    }).catch(e => toast('Error: ' + e.message, true));
  }

  async function deleteAsset(id) {
    try {
      await fetch(`${API}/assets/${id}`, { method: 'DELETE' });
      loadAssets();
      toast('Deleted');
    } catch (e) {
      toast('Error: ' + e.message, true);
    }
  }

  // ── helpers ────────────────────────────────────────────

  function esc(t) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(t || ''));
    return d.innerHTML;
  }

  function fmtNum(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
    return String(n);
  }

  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' +
           d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
  }

  function getCountdown(iso) {
    const diff = new Date(iso) - Date.now();
    if (diff <= 0) return 'now';
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    if (h > 0) return `in ${h}h ${m}m`;
    return `in ${m}m`;
  }

  let _toastTimer;
  function toast(msg, err = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast' + (err ? ' err' : '') + ' show';
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove('show'), 3400);
  }

  // ── keyboard shortcuts ─────────────────────────────────

  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      if (!document.getElementById('postBtn').disabled) handlePost();
    }
    if ((e.metaKey || e.ctrlKey) && e.key === 's') {
      e.preventDefault();
      saveDraftFromComposer();
    }
  });

  // ── init ───────────────────────────────────────────────

  if (!restoreComposer()) addCard();
  checkVPS();
  loadDrafts();
  setInterval(checkVPS, 30000);
</script>

</body>
</html>
